name: CI

on:
  push:
    branches: [main]
    # A version tag publishes the image the NAS pulls.
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest

    services:
      # Integration tests run against a real PostgreSQL 16, matching production.
      # The money math and the budget identity are only meaningfully verified
      # against real BIGINT columns and real transactions.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: household_budget_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/household_budget_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/household_budget_test?schema=public

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations
        run: npm run db:deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm run test

      - name: Integration tests
        run: npm run test:integration

      # The cached balances must agree with the event ledger on a freshly seeded
      # database. If they ever disagree, the cache maintenance is broken.
      - name: Seed and verify cached balances match the ledger
        run: |
          npm run db:seed
          npm run build --workspace @budget/api
          npm run recompute-balances --workspace @budget/api -- --check

      # An untested backup is not a backup (§14). This seeds a database, dumps
      # it, destroys the contents, restores, and compares counts and balances
      # either side — a real exercise rather than an inspection.
      - name: Verify the backup can be restored
        run: ./scripts/verify-restore.sh

      # The UI is typechecked by `npm run typecheck`, but only a real build catches
      # a broken import path or a Tailwind token that does not resolve.
      - name: Build the web application
        run: npm run build --workspace @budget/web

      # Only a browser driving the built server catches what unit and integration
      # tests structurally cannot: the application failing to boot, a component
      # that renders wrong, or a control nobody can actually reach.
      - name: Install the browser for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload the end-to-end trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # A CLI entrypoint can be broken by module resolution alone and still pass
      # every unit test, because nothing else ever executes the entrypoint. This
      # runs each one with input that fails validation before any network call,
      # which proves the command at least loads and reports errors readably.
      - name: Smoke-test the CLI entrypoints
        run: |
          if npm run simplefin:claim -- not-a-real-token > /tmp/claim-output 2>&1; then
            echo 'Expected simplefin:claim to reject an invalid token, but it succeeded.'
            cat /tmp/claim-output
            exit 1
          fi
          grep -q 'does not decode to a claim URL' /tmp/claim-output || {
            echo 'simplefin:claim failed for the wrong reason:'
            cat /tmp/claim-output
            exit 1
          }

  forbidden-terms:
    name: Forbidden terminology
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # A hard constraint of this project: the asset is called Bitcoin, and the
      # generic term for the asset class appears nowhere. Enforced in CI rather
      # than by memory, because it has to hold in code, comments, column names,
      # commit messages and UI copy alike.
      #
      # The ban is on the *asset class*, not the word's other senses.
      # Cryptography is an ordinary engineering word and Node's `node:crypto` is
      # a standard library module; forbidding those bought nothing and pushed the
      # code towards worse alternatives, so both are allowed.
      - name: Reject the forbidden term
        run: |
          # The asset-class word itself is never permitted, in any form.
          if git grep -rniE 'cryptocurrenc(y|ies)' -- \
              ':!package-lock.json' ':!.github/workflows/ci.yml' > /tmp/currency; then
            echo 'Forbidden terminology found. The only term for this asset is Bitcoin (or BTC):'
            cat /tmp/currency
            exit 1
          fi

          # A bare "crypto" is the asset-class abbreviation unless it is one of
          # the recognised cryptography or Node-module forms.
          allowed='cryptograph(ic|y|ically)|node:crypto|crypto\.[a-zA-Z]|webcrypto|@types/node'
          if git grep -rniE 'crypto' -- \
              ':!package-lock.json' ':!.github/workflows/ci.yml' > /tmp/hits; then
            if grep -viE "$allowed" /tmp/hits | grep -q .; then
              echo 'Forbidden terminology found. The only term for this asset is Bitcoin (or BTC):'
              grep -viE "$allowed" /tmp/hits
              exit 1
            fi
          fi
          echo 'No forbidden terminology.'

  image:
    name: Container image
    runs-on: ubuntu-latest

    # Only what publishing needs. `contents: read` is stated rather than left to
    # the default so widening it later is a visible change.
    permissions:
      contents: read
      packages: write
      # Sigstore keyless signing: the workflow proves its own identity to the
      # transparency log, so there is no signing key to hold or rotate.
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # ubuntu-latest is x86_64, which is what the DS220+ runs. Building here
      # rather than on a developer's Mac is the whole point: a Mac produces an
      # arm64 image the NAS cannot start. See ADR 005.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: delegate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the image starts, applies migrations and answers its health check
      # against a real database — the failure mode a build alone cannot catch.
      - name: Start it against PostgreSQL and check its health
        run: |
          docker network create delegate-ci
          docker run -d --name pg --network delegate-ci \
            -e POSTGRES_PASSWORD=ci-password -e POSTGRES_DB=delegate \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U postgres -d delegate && break
            sleep 2
          done

          docker run -d --name app --network delegate-ci -p 8088:3000 \
            -e DATABASE_URL=postgresql://postgres:ci-password@pg:5432/delegate \
            -e SESSION_SECRET=ci-session-secret-at-least-32-characters \
            delegate:ci

          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8088/health > /dev/null; then
              echo 'The image is serving.'
              break
            fi
            if [ "$i" = "45" ]; then
              echo 'The container never became healthy. Logs:'
              docker logs app
              exit 1
            fi
            sleep 2
          done

          # The UI must be served too, not just the API: they ship in one image.
          curl -fsS http://localhost:8088/ | grep -q '<title>Delegate</title>'
          echo 'The interface is served by the same container.'

      # --- Publishing -----------------------------------------------------
      #
      # Only from `main` and version tags, and never from a pull request. An
      # unreviewed branch must not be able to produce something the NAS would
      # pull and run.
      #
      # Two routes onto the NAS, deliberately. The registry is the ordinary one;
      # the tarball needs no credential on the NAS at all, which matters while
      # this is LAN-only and every credential on that machine is one more thing
      # to protect.

      - name: Sign in to the registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The workflow's own token, scoped by the permissions above. No
          # long-lived secret is stored in the repository.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        if: github.event_name == 'push'
        id: tags
        run: |
          image=ghcr.io/${{ github.repository }}
          # Lowercased: a registry reference must be lowercase, and a GitHub
          # owner or repository name need not be.
          image=$(echo "$image" | tr '[:upper:]' '[:lower:]')

          if [ "${{ github.ref_type }}" = "tag" ]; then
            # A tag is a release: it takes `latest`, which is what the Compose
            # file defaults to, plus its own version.
            echo "tags=$image:${{ github.ref_name }},$image:latest" >> "$GITHUB_OUTPUT"
            echo "image=$image" >> "$GITHUB_OUTPUT"
          else
            # main is always deployable, but `latest` is reserved for tags so a
            # NAS pull cannot pick up an untagged commit by accident.
            echo "tags=$image:main,$image:${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "image=$image" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish it
        if: github.event_name == 'push'
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Records how this image was built — which repository, which workflow,
          # which commit. The deploy script refuses to start an image whose
          # provenance does not say this repository. See ADR 012.
          provenance: mode=max
          sbom: true

      # The digest is what actually gets deployed, so it is printed where a human
      # can find it rather than left to be dug out of the registry.
      - name: Report the digest
        if: github.event_name == 'push'
        run: |
          {
            echo '### Image published'
            echo
            echo '```'
            echo '${{ steps.tags.outputs.image }}@${{ steps.publish.outputs.digest }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The no-credential route. Downloaded from the run, copied to the NAS, and
      # loaded with `docker load` — nothing to authenticate, nothing left at rest
      # on the machine afterwards.
      - name: Save a loadable tarball
        if: github.event_name == 'push'
        run: |
          docker save delegate:ci | gzip > delegate-image.tar.gz
          ls -lh delegate-image.tar.gz

      - name: Upload the tarball
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: delegate-image
          path: delegate-image.tar.gz
          retention-days: 14

      # Signed through Sigstore rather than GitHub's attestation store, which is
      # unavailable to user-owned private repositories — it asks you to make the
      # repository public, which is not a trade this project will make. Sigstore
      # is the better dependency regardless: the proof does not hinge on a
      # GitHub plan tier, and the signature lands in the same registry as the
      # image.
      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3

      - name: Sign the image
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE: ${{ steps.tags.outputs.image }}
        run: |
          # Keyless: the workflow's own OIDC identity is what gets certified, so
          # there is no signing key for anyone to hold, leak or rotate. The
          # certificate records which repository, workflow and ref produced this,
          # which is exactly what deploy.sh checks before starting it.
          cosign sign --yes "${IMAGE}@${DIGEST}"
