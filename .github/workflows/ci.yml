name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest

    services:
      # Integration tests run against a real PostgreSQL 16, matching production.
      # The money math and the budget identity are only meaningfully verified
      # against real BIGINT columns and real transactions.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: household_budget_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/household_budget_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/household_budget_test?schema=public

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations
        run: npm run db:deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm run test

      - name: Integration tests
        run: npm run test:integration

      # The cached balances must agree with the event ledger on a freshly seeded
      # database. If they ever disagree, the cache maintenance is broken.
      - name: Seed and verify cached balances match the ledger
        run: |
          npm run db:seed
          npm run build --workspace @budget/api
          npm run recompute-balances --workspace @budget/api -- --check

      # The UI is typechecked by `npm run typecheck`, but only a real build catches
      # a broken import path or a Tailwind token that does not resolve.
      - name: Build the web application
        run: npm run build --workspace @budget/web

      # A CLI entrypoint can be broken by module resolution alone and still pass
      # every unit test, because nothing else ever executes the entrypoint. This
      # runs each one with input that fails validation before any network call,
      # which proves the command at least loads and reports errors readably.
      - name: Smoke-test the CLI entrypoints
        run: |
          if npm run simplefin:claim -- not-a-real-token > /tmp/claim-output 2>&1; then
            echo 'Expected simplefin:claim to reject an invalid token, but it succeeded.'
            cat /tmp/claim-output
            exit 1
          fi
          grep -q 'does not decode to a claim URL' /tmp/claim-output || {
            echo 'simplefin:claim failed for the wrong reason:'
            cat /tmp/claim-output
            exit 1
          }

  forbidden-terms:
    name: Forbidden terminology
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # A hard constraint of this project: the asset is called Bitcoin, and the
      # generic term for the asset class appears nowhere. Enforced in CI rather
      # than by memory, because it has to hold in code, comments, column names,
      # commit messages and UI copy alike.
      #
      # The ban is on the *asset class*, not the word's other senses.
      # Cryptography is an ordinary engineering word and Node's `node:crypto` is
      # a standard library module; forbidding those bought nothing and pushed the
      # code towards worse alternatives, so both are allowed.
      - name: Reject the forbidden term
        run: |
          # The asset-class word itself is never permitted, in any form.
          if git grep -rniE 'cryptocurrenc(y|ies)' -- \
              ':!package-lock.json' ':!.github/workflows/ci.yml' > /tmp/currency; then
            echo 'Forbidden terminology found. The only term for this asset is Bitcoin (or BTC):'
            cat /tmp/currency
            exit 1
          fi

          # A bare "crypto" is the asset-class abbreviation unless it is one of
          # the recognised cryptography or Node-module forms.
          allowed='cryptograph(ic|y|ically)|node:crypto|crypto\.[a-zA-Z]|webcrypto|@types/node'
          if git grep -rniE 'crypto' -- \
              ':!package-lock.json' ':!.github/workflows/ci.yml' > /tmp/hits; then
            if grep -viE "$allowed" /tmp/hits | grep -q .; then
              echo 'Forbidden terminology found. The only term for this asset is Bitcoin (or BTC):'
              grep -viE "$allowed" /tmp/hits
              exit 1
            fi
          fi
          echo 'No forbidden terminology.'
