name: CI

on:
  push:
    branches: [main]
    # A version tag publishes the image the NAS pulls.
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest

    services:
      # Integration tests run against a real PostgreSQL 16, matching production.
      # The money math and the budget identity are only meaningfully verified
      # against real BIGINT columns and real transactions.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: household_budget_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/household_budget_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/household_budget_test?schema=public

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations
        run: npm run db:deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Fails the build only on what ships. A high or critical advisory in a
      # runtime dependency is a reason to stop; one in a test runner is a reason
      # to read, which is what the second step is for.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit everything, for the record
        run: npm audit || true

      - name: Unit tests
        run: npm run test

      - name: Integration tests
        run: npm run test:integration

      # The cached balances must agree with the event ledger on a freshly seeded
      # database. If they ever disagree, the cache maintenance is broken.
      - name: Seed and verify cached balances match the ledger
        run: |
          npm run db:seed
          npm run build --workspace @budget/api
          npm run recompute-balances --workspace @budget/api -- --check

      # An untested backup is not a backup (§14). This seeds a database, dumps
      # it, destroys the contents, restores, and compares counts and balances
      # either side — a real exercise rather than an inspection.
      - name: Verify the backup can be restored
        run: ./scripts/verify-restore.sh

      # The UI is typechecked by `npm run typecheck`, but only a real build catches
      # a broken import path or a Tailwind token that does not resolve.
      - name: Build the web application
        run: npm run build --workspace @budget/web

      # Only a browser driving the built server catches what unit and integration
      # tests structurally cannot: the application failing to boot, a component
      # that renders wrong, or a control nobody can actually reach.
      - name: Install the browser for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload the end-to-end trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # A CLI entrypoint can be broken by module resolution alone and still pass
      # every unit test, because nothing else ever executes the entrypoint. This
      # runs each one with input that fails validation before any network call,
      # which proves the command at least loads and reports errors readably.
      - name: Smoke-test the CLI entrypoints
        run: |
          if npm run simplefin:claim -- not-a-real-token > /tmp/claim-output 2>&1; then
            echo 'Expected simplefin:claim to reject an invalid token, but it succeeded.'
            cat /tmp/claim-output
            exit 1
          fi
          grep -q 'does not decode to a claim URL' /tmp/claim-output || {
            echo 'simplefin:claim failed for the wrong reason:'
            cat /tmp/claim-output
            exit 1
          }

  forbidden-terms:
    name: Forbidden terminology
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # A hard constraint of this project: the asset is called Bitcoin, and the
      # generic term for the asset class appears nowhere. Enforced in CI rather
      # than by memory, because it has to hold in code, comments, column names,
      # commit messages and UI copy alike.
      #
      # The ban is on the *asset class*, not the word's other senses.
      # Cryptography is an ordinary engineering word and Node's `node:crypto` is
      # a standard library module; forbidding those bought nothing and pushed the
      # code towards worse alternatives, so both are allowed.
      - name: Reject the forbidden term
        run: |
          # The asset-class word itself is never permitted, in any form.
          if git grep -rniE 'cryptocurrenc(y|ies)' -- \
              ':!package-lock.json' ':!.github/workflows/ci.yml' > /tmp/currency; then
            echo 'Forbidden terminology found. The only term for this asset is Bitcoin (or BTC):'
            cat /tmp/currency
            exit 1
          fi

          # A bare "crypto" is the asset-class abbreviation unless it is one of
          # the recognised cryptography or Node-module forms.
          allowed='cryptograph(ic|y|ically)|node:crypto|crypto\.[a-zA-Z]|webcrypto|@types/node'
          if git grep -rniE 'crypto' -- \
              ':!package-lock.json' ':!.github/workflows/ci.yml' > /tmp/hits; then
            if grep -viE "$allowed" /tmp/hits | grep -q .; then
              echo 'Forbidden terminology found. The only term for this asset is Bitcoin (or BTC):'
              grep -viE "$allowed" /tmp/hits
              exit 1
            fi
          fi
          echo 'No forbidden terminology.'

  image:
    name: Container image
    runs-on: ubuntu-latest

    # Read-only. Nothing is published from here any more, so the write scopes
    # this job used to hold are gone — a token that can publish is a token worth
    # stealing, and this one no longer can.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # ubuntu-latest is x86_64, which is what the DS220+ runs. Building here
      # rather than on a developer's Mac is the whole point: a Mac produces an
      # arm64 image the NAS cannot start. See ADR 005.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: delegate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the image starts, applies migrations and answers its health check
      # against a real database — the failure mode a build alone cannot catch.
      - name: Start it against PostgreSQL and check its health
        run: |
          docker network create delegate-ci
          docker run -d --name pg --network delegate-ci \
            -e POSTGRES_PASSWORD=ci-password -e POSTGRES_DB=delegate \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U postgres -d delegate && break
            sleep 2
          done

          docker run -d --name app --network delegate-ci -p 8088:3000 \
            -e DATABASE_URL=postgresql://postgres:ci-password@pg:5432/delegate \
            -e SESSION_SECRET=ci-session-secret-at-least-32-characters \
            delegate:ci

          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8088/health > /dev/null; then
              echo 'The image is serving.'
              break
            fi
            if [ "$i" = "45" ]; then
              echo 'The container never became healthy. Logs:'
              docker logs app
              exit 1
            fi
            sleep 2
          done

          # The UI must be served too, not just the API: they ship in one image.
          curl -fsS http://localhost:8088/ | grep -q '<title>Delegate</title>'
          echo 'The interface is served by the same container.'

      # Plain http is the default (ADR 017), so the TLS path is the one nobody
      # exercises by accident. The same image, the same database, one certificate
      # and two environment variables — if this ever stops working, it should
      # stop here rather than on the NAS.
      - name: Start the same image over TLS and check its health
        run: |
          docker rm -f app

          # The runner cannot chown to another uid without root, and the script
          # says so rather than failing silently. This is the same step the NAS
          # needs, which is why the script prints it.
          sudo ./scripts/make-tls-cert.sh 127.0.0.1 localhost

          docker run -d --name app-tls --network delegate-ci -p 8443:3000 \
            -v "$PWD/tls:/tls:ro" \
            -e DATABASE_URL=postgresql://postgres:ci-password@pg:5432/delegate \
            -e SESSION_SECRET=ci-session-secret-at-least-32-characters \
            -e TLS_CERT_PATH=/tls/delegate.crt \
            -e TLS_KEY_PATH=/tls/delegate.key \
            -e SESSION_COOKIE_SECURE=true \
            delegate:ci

          for i in $(seq 1 45); do
            # --insecure: the certificate is self-signed by design. What is under
            # test is that TLS is negotiated at all.
            if curl -fsS --insecure https://localhost:8443/health > /dev/null; then
              echo 'The image is serving over TLS.'
              break
            fi
            if [ "$i" = "45" ]; then
              echo 'The container never became healthy over TLS. Logs:'
              docker logs app-tls
              exit 1
            fi
            sleep 2
          done

          # And plain http must now fail, or "TLS is on" would mean nothing.
          if curl -fsS --max-time 5 http://localhost:8443/health > /dev/null 2>&1; then
            echo 'The server answered plain http while TLS was configured.'
            exit 1
          fi
          echo 'Plain http is refused while TLS is configured.'

      # Nothing is published from here, deliberately.
      #
      # GitHub Packages and workflow artifacts draw on one pooled storage
      # allowance, and a 245MB image on every push filled it in a week — which
      # then failed a release, because the signing step sat behind an artifact
      # upload. See ADR 019.
      #
      # The image is built on the NAS instead, which is x86_64 and therefore the
      # native architecture anyway. What CI is for is the answer to "do the tests
      # pass on a clean machine" — minutes are free and logs are not storage.
